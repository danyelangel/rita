<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rita Wizard (PROTOTYPE, throwaway)</title>
<!--
  PROTOTYPE: finalized clickable Wizard, steps 1-11, mock data only. Throwaway; not production code.
  Question it answers: does the whole settled Wizard hang together as a mobile-first flow, ending on Plans + Plan detail?
  Variants: none. This is the single "finalized" design the ticket asks for, so no ?variant= switcher; a bottom dev bar jumps between steps.
  Run: double-click this file. No build, no network, no persistence (state lives in memory; reload resets).
  Copy goes through t() (gettext style, English text as key) so a Spanish locale can be dropped into LOCALE later.
  Mock store: "Casa Tejida" (home textiles, Colombia, COP). Every number is invented.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1d1b17;--mute:#6b6759;--line:#e4ddd0;--navy:#22305a;--yellow:#f5d97e;--green:#3fb36b;--accent:#22305a;--accent-ink:#fff;--warn:#8a6512;--warn-bg:#fbf1cf;--bad:#a1302b;--ok:#216b3f;--ok-bg:#e3f4e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif}
#wrap{max-width:440px;margin:0 auto;min-height:100vh;padding:0 16px 230px}
header.top{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand img{height:34px;width:auto;display:block}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.stepno{font-size:12px;color:var(--mute);margin-top:6px}
h1{font-size:30px;line-height:1.1;margin:20px 0 8px;color:var(--navy);font-weight:700;letter-spacing:-.5px}
h2{font-size:19px;margin:22px 0 8px;color:var(--navy)}
p{margin:6px 0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.wrapf{flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border-radius:999px;border:2px solid var(--navy);background:transparent;color:var(--navy);padding:11px 20px;cursor:pointer}
button.pri{background:var(--yellow);color:var(--ink);border-color:var(--navy);font-weight:700;box-shadow:0 4px 0 0 var(--navy);margin-bottom:4px}
button.pri:active{transform:translateY(3px);box-shadow:0 1px 0 0 var(--navy)}
button.pri:disabled{opacity:.4;cursor:not-allowed}
button.link{border:0;background:none;color:var(--navy);padding:6px 2px;text-decoration:underline;font-weight:500}
button.full{width:100%}
button.sm{padding:6px 14px;font-size:14px}
button.pri.sm{box-shadow:0 3px 0 0 var(--navy)}
button.danger{color:var(--bad)}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.chip{display:inline-block;padding:6px 13px;border:2px solid var(--line);border-radius:99px;font-weight:500;margin:3px 3px 3px 0;background:var(--card);font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--navy)}
.tag{white-space:nowrap;display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mute)}
.card.found{border-color:var(--green);background:var(--ok-bg)}.card.miss{border-color:var(--bad);background:#fbe9e8}.card.found textarea,.card.miss textarea{background:var(--card)}
.tag.bad{background:#f6d4d1;color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.note{border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0;background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.bad{background:#fbe9e8;color:var(--bad)}
.prog{list-style:none;padding:0;margin:10px 0}
.prog li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.run{background:var(--warn);animation:p 1s infinite}.dot.done{background:var(--green)}
@keyframes p{50%{opacity:.3}}
.sw{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:inline-block}
.src{font-size:12px;color:var(--mute)}
.big{font-size:28px;font-weight:700}
.chg{background:var(--bg);border-radius:12px;padding:4px 14px;margin:10px 0}
.chg .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.chg .r:last-child{border-bottom:0}.chg .l{color:var(--mute);flex:none}.chg .v{text-align:right;font-weight:600;color:var(--navy);min-width:0;overflow-wrap:anywhere}
.chg .r.ba{flex-direction:column;gap:2px}.chg .r.ba .v{text-align:left;font-size:18px}.chg .arr{font-style:normal;color:var(--mute);margin:0 8px}
.chg s{color:var(--mute);font-weight:400}
.kind{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mute)}
.sticky{position:fixed;left:0;right:0;bottom:46px;padding:10px 16px;background:linear-gradient(transparent,var(--bg) 40%);z-index:6}
.sticky>div{max-width:440px;margin:0 auto}
#dev{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;background:#111;color:#fff;border-radius:99px;padding:5px 10px;font-size:12px;display:flex;gap:8px;align-items:center;z-index:50;box-shadow:0 2px 12px #0006}
#dev select{width:auto;padding:3px 6px;font-size:12px;background:#222;color:#fff;border:1px solid #444}
#dev button{white-space:nowrap;padding:3px 9px;font-size:12px;background:#222;color:#fff;border-color:#444}
#chatfab{box-shadow:0 4px 0 0 var(--navy)!important;position:fixed;right:14px;bottom:100px;z-index:40}
#chat{background:#ebe5d8!important;position:fixed;right:14px;bottom:120px;width:min(330px,calc(100vw - 28px));max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;z-index:40;box-shadow:0 6px 24px #0003}
.msg{padding:8px 11px;border-radius:12px;margin:6px 0;max-width:88%;font-size:14px;background:#fff}
.msg.u{background:#dcf8c6;margin-left:auto}
.planimg{border-radius:10px;background:var(--navy);color:#fff;padding:14px;margin-top:6px;font-size:13px}
.qr{width:120px;height:120px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--card) 0 50%) 0 0/20px 20px;border:8px solid var(--card);outline:1px solid var(--line);border-radius:6px}
.palette{display:flex;flex-wrap:wrap;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.sw2{position:relative;display:block;width:64px;height:64px;border-radius:16px;border:2px solid var(--line);cursor:pointer;margin:0;overflow:hidden;padding:0}
.sw2 input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;cursor:pointer}
.sw2.add{background:transparent;border:2px dashed var(--navy);color:var(--navy);font-size:26px;font-weight:400;padding:0;box-shadow:none}
.tile code{font-size:11px;color:var(--mute)}
.tile .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;padding:0;border-radius:50%;font-size:11px;background:var(--card);border:2px solid var(--line);color:var(--mute);display:none}
.tile:hover .x,.tile:focus-within .x{display:block}
.fbpop{position:relative}
.fbtn{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:400;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px}
.fbtn[aria-expanded=true]{border-color:var(--navy)}
.fblist{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:2px solid var(--navy);border-radius:14px;padding:6px;box-shadow:0 8px 24px #22305a33;max-height:280px;overflow:auto}
.fbopt{width:100%;display:flex;justify-content:space-between;border:0;border-radius:10px;font-size:17px;font-weight:400;text-align:left;padding:10px 12px;background:transparent;color:var(--ink)}
.fbopt:hover{background:var(--bg)}.fbopt.sel{background:var(--yellow)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);display:grid;place-items:center;font-weight:700;color:var(--navy)}
.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:52px!important;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px;z-index:7}
.tab{display:flex;flex-direction:column;align-items:center;gap:0;flex:1;max-width:120px;border:0;border-radius:12px;padding:6px 4px;font-size:12px;font-weight:600;color:var(--mute)}
.tab span{display:grid;place-items:center;height:24px}.tab svg{display:block}.tab.on{color:var(--navy);background:var(--bg)}
.sticky.app{bottom:112px}
.thread{padding:12px 0 150px;min-height:60vh}
.thread .msg{font-size:15px;max-width:85%;padding:9px 12px;border-radius:14px;margin:8px 0;background:var(--card);border:1px solid var(--line)}
.thread .msg.u{background:#dcf8c6;border-color:#cfe9b8;margin-left:auto}
.composer{position:fixed;left:0;right:0;bottom:112px;max-width:440px;margin:0 auto;padding:10px 16px;background:var(--bg);display:flex;gap:8px;align-items:center;z-index:8}
.composer input{border-radius:99px}
.cre{border-top:1px solid var(--line);padding:12px 0 0;margin:12px 0 0}
.cf{margin:8px 0}.cf input,.cf textarea{padding:8px 10px;font-size:15px}
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.mail .mh{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.mail .mb{padding:14px 14px 16px;font-size:14px}.mail .mb p{margin:8px 0}
.mhl{font-size:19px;font-weight:700;line-height:1.2}
.mbtn{display:inline-block;color:#fff;border-radius:99px;padding:8px 18px;font-weight:700;font-size:14px;margin-top:6px}
.unv{background:#fff1c9;border-radius:6px;padding:2px 4px;outline:1px dashed var(--warn)}
.uvt{font-size:11px;font-weight:700;color:var(--warn)}
.mad{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.mimg{height:150px;background:#f3eee2}
.chk{margin-top:10px;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mute)}
.chk .ok{color:var(--ok)}.chk .bad{color:var(--bad);font-weight:700}.chk .warnc{color:var(--warn);font-weight:700}
.hero{height:150px;position:relative;overflow:hidden;background:#f3eee2}
.shp{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;background:#fffd;border-radius:99px;padding:2px 7px;color:#5c8a3a;letter-spacing:.2px}
.pimg{position:relative;overflow:hidden;background:#f3eee2;border-radius:10px;aspect-ratio:1}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{font-size:12px}.pn{font-weight:600;margin-top:5px;line-height:1.2}.pp{color:var(--mute)}
.ptt{font-weight:700;font-size:16px;margin-bottom:8px}
.mad .mimg{position:relative;height:150px}
.tsum{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border-radius:16px;padding:14px 18px;font-weight:400;color:var(--ink);border:2px solid var(--line);background:var(--card);margin:12px 0}
.task{margin:26px 0 30px;padding-top:6px}
.task>.row h2{font-size:21px}
.task>p{margin:8px 0}
.task .card{margin:14px 0}
.menuwrap{position:relative}
button.avatar{padding:0;font-size:16px;cursor:pointer}
.umenu{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--card);border:2px solid var(--navy);border-radius:16px;padding:6px;z-index:30;box-shadow:0 8px 24px #22305a33}
.umenu .uhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.umenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:10px;padding:11px 12px;text-align:left;font-weight:500;color:var(--ink);background:transparent}
.umenu button:hover{background:var(--bg)}.umenu button.out{color:var(--bad);border-top:1px solid var(--line);border-radius:0 0 10px 10px;margin-top:4px}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}.stat.hl{background:var(--yellow)}.stat.bad{background:#fbe9e8}
.sv{font-size:24px;font-weight:700;color:var(--navy);line-height:1.1}.sl{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.25}
.chan{padding:10px 0;border-bottom:1px solid var(--line)}.chan:last-of-type{border-bottom:0}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.it:last-child{border-bottom:0}
.sd{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}.sd.ok{background:var(--green)}.sd.warn{background:#e0a21a}.sd.bad{background:var(--bad)}
.dxsum{border-color:var(--navy)}
.gapfig{display:block;width:fit-content;margin-top:10px;padding:2px 14px 4px;border-radius:14px;background:var(--yellow);border:2px solid var(--navy);white-space:nowrap;font-size:40px}
.gapfig small{font-size:18px;font-weight:600}
.note.err{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--bad)}.eic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.help{margin-top:4px;font-weight:700;color:var(--navy);font-size:14px}.help::before{content:'→ ';font-weight:400}
.steps{margin:4px 0 0;padding-left:20px}.steps li{margin:2px 0}
.fgroup{margin:20px 0 8px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.feat{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.fic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--yellow);border:2px solid var(--navy);color:var(--navy);display:grid;place-items:center}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{border-radius:20px;padding:16px;border:2px solid var(--navy);display:flex;flex-direction:column;gap:6px;min-width:0}
.tl.wide{grid-column:span 2}.tl p{margin:0;font-size:14px;line-height:1.35}.tl .tt{font-size:16px;line-height:1.2}
.tl.navy{background:var(--navy);color:#fff}.tl.navy .tt{font-size:20px}.tl.yel{background:var(--yellow)}.tl.grn{background:#d8f0e0}.tl.blu{background:#dce8fb}.tl.wht{background:var(--card)}
.tic{width:38px;height:38px;border-radius:12px;background:#ffffffb0;display:grid;place-items:center;color:var(--navy);margin-bottom:4px}
.mini{background:#ffffff14;border:2px dashed #ffffff80;border-radius:14px;padding:10px 12px 6px;margin-top:10px}
.mex{display:flex;gap:8px;align-items:center;font-size:12px;color:#ffffffcc;padding-bottom:8px;border-bottom:1px solid #ffffff2e}.exb{flex:none;background:var(--yellow);color:var(--ink);font-weight:700;font-size:11px;letter-spacing:.6px;border-radius:99px;padding:3px 9px}
.mr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff2e;font-size:14px}.mr.end{border-bottom:0;align-items:center}
.bub{max-width:86%;border-radius:14px;padding:8px 12px;font-size:14px}.bub.u{background:#dcf8c6;align-self:flex-end}.bub.r{background:var(--bg);border:1px solid var(--line)}
.ck{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.fs{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:600;line-height:1.15}.fn{width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:700}
.fs:nth-child(3) .fn{background:#fff}
.hide{display:none}
</style>
</head>

// ---------- chat panel ----------

}

});
